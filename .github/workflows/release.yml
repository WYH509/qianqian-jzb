name: Release

on:
  push:
    tags: ['v*']  # v1.0.0 / v1.2.3 / v2.0.0-beta.1 等
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to release (manual run)'
        required: true
        default: 'manual-v{run_number}'
      generate_changelog:
        description: 'Generate changelog'
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changelog 要全历史

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify CI checks pass
        run: |
          npm run typecheck --workspace=apps/api || npm run typecheck
          npm test --workspace=apps/api -- --run --coverage
          npm run build --workspace=apps/api
          npm run build --workspace=apps/web

      - name: Generate changelog (latest tag..HEAD)
        if: github.event_name == 'push'
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          [ -z "$PREV_TAG" ] && PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          echo "Generating changelog from $PREV_TAG to $GITHUB_REF_NAME"
          CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h) — %an" --no-merges)
          echo "## Changes since $PREV_TAG" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$CHANGELOG" >> CHANGELOG.md
          cat CHANGELOG.md

      - name: Parse semver from tag
        id: semver
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          MAJOR=$(echo $TAG | cut -d. -f1 | tr -d 'v')
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          # draft: true → release 以「草稿」创建（step 显示 success 是正常的）。
          # ⚠️ 草稿 release 不会出现在匿名(未认证)的 Releases API：
          #   /releases、/releases/latest、/releases/tags/{tag} 都只返回【已发布】release。
          # 所以「API 返回 0 release」≠ 没创建，而是草稿对匿名 API 不可见。
          # 查看/发布草稿：登录 web UI → Releases → Drafts，或 `gh release edit <tag> --draft=false`。
          draft: true
          generate_release_notes: false  # 用我们自己的
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log release URL
        run: |
          echo "✅ Draft release created: ${{ steps.create_release.outputs.url }}"
          echo "   （草稿不出现在匿名 API，去 web UI Releases → Drafts 查看并 Publish）"
